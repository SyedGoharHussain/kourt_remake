org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pub cache (C:) and project (D:) live on different drives; Kotlin's incremental
# compilation cache can't compute a relative path across drive roots on Windows,
# which crashes plugin compilation. Disable it (full recompiles, no cache bug).
kotlin.incremental=false
# Older plugins (e.g. tflite_flutter) compile Java at 1.8 but Kotlin at the
# JDK-21 default, which the strict check rejects. Downgrade it to a warning;
# D8 dexes the mixed class versions fine.
kotlin.jvm.target.validation.mode=warning
